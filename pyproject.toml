[project]
name = "transit-parser"
version = "0.1.0"
description = "A set of scripts for parsing transit data into Vega-Lite JSON"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "orjson>=3.10.12",
    "polars>=1.16.0",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
]

[tool.ruff]
target-version = "py312"
