[project]
name = "transit-parser"
version = "0.1.0"
description = "A set of scripts for parsing transit data into Vega-Lite JSON"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel[polars,pyarrow]>=0.21",
    "holidays>=0.107",
    "orjson>=3.13",
    "pdfplumber>=0.11",
    "polars>=2.0",
    "requests>=2.34",
    "tqdm>=4.70",
    "zstandard>=0.25",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
