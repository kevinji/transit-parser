[project]
name = "transit-parser"
version = "0.1.0"
description = "A set of scripts for parsing transit data into Vega-Lite JSON"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel[polars,pyarrow]>=0.15",
    "holidays>=0.80",
    "orjson>=3.11.6",
    "polars>=1.32",
    "requests>=2.32",
    "tqdm>=4.67",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
